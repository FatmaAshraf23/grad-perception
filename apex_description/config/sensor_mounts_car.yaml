# Where the sensors sit on the REAL car -- PLACEHOLDERS until measured (status: placeholder -> sensor_frames WARNS).
# Read by apex_description sensor_frames (static TFs); the car's launch file must give the EKF / obstacle node the
# SAME laser numbers (laser_x, laser_y, laser_yaw).
#
# base_link = the point StateEstimate reports: the car's centre of gravity, ON THE FLOOR (z = 0 = floor),
#             x forward, y left, z up (ROS REP 103). Positions in METRES from there, angles in DEGREES:
#   yaw > 0 = turned LEFT     pitch > 0 = tilted DOWN     roll > 0 = left side UP (clockwise, seen from behind)
#
# HOW TO MEASURE (car on a flat floor, wheels straight; tape measure + a phone level app):
#   0. Mark base_link on the floor below the centre of gravity (ask the vehicle-dynamics teammate for lr = CG to
#      rear axle -- the MPC uses the same point). Measure everything from that mark.
#   1. laser x, y, z: to the CENTRE of the RPLIDAR's spinning head; z = floor to the middle of its window.
#   2. laser yaw: put a box ~1 m straight ahead of the car. In /scan (Foxglove / RViz, fixed frame laser) it must
#      be on the +x axis (angle 0). If it shows up behind, yaw: 180; on the left / right side, -90 / +90.
#   3. camera x, y, z: to the middle of the LENS. pitch: phone level app on the camera's flat back or top.
#   4. status: measured. Then the camera-LiDAR calibration (fusion prep) refines the camera numbers.
#   5. Check: ros2 run apex_description check_frames --mounts car
