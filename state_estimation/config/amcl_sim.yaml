# AMCL settings for the simulator (RPLIDAR A1-like scan, wall map).
# Copy to:  ~/ros2_ws/src/state_estimation/config/amcl_sim.yaml
# The start pose (initial_pose) is set from the launch file.
amcl:
  ros__parameters:
    use_sim_time: false

    # --- Frames (see sim_scan_relay.py for why these are 'est/...') ---
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "est/base_link"
    scan_topic: "/scan_amcl"
    map_topic: "/map"             # sim_localization: /map_amcl = thin-wall copy (amcl_map.py)
    tf_broadcast: true            # AMCL publishes map -> odom
    transform_tolerance: 0.3      # s

    # --- Particles ---
    min_particles: 500
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.05            # m    filter after this much motion...
    update_min_a: 0.05            # rad  ...or this much rotation
    recovery_alpha_slow: 0.0      # no random particles for now (turn on for
    recovery_alpha_fast: 0.0      # "kidnapped robot" recovery later)

    # --- Motion model: how much noise to add when moving the particles ---
    # alpha1: rotation noise from rotation, alpha2: rotation noise from
    # translation, alpha3: translation noise from translation, alpha4:
    # translation noise from rotation (variances: alpha * step^2 per update).
    # 2026-10-06: 0.1 -> 0.02 (jobs 058-063, offline AMCL replays): AMCL's
    # particle cloud slid BACKWARDS in the long corridors (up to 38 cm).
    # 2026-10-19: alpha1 0.005, alpha2 0.0005, alpha4 0.005 (alpha3 stays 0.02).
    # WHY (AMCL-sliding work, jobs 154-158; a Python replica of nav2 AMCL found
    # it): AMCL updates only every scan (7 per s), i.e. every ~0.85 m at 6 m/s.
    # alpha2 = 0.02 turned every particle's direction by a random +-7 deg on
    # every update. A particle that zig-zags covers less ground ALONG the track
    # than one going straight (cos effect), so the cloud's centre fell behind
    # the car on every straight -- even with PERFECT odometry (job 156: still
    # ~6 cm behind). Our odometry's heading comes from the gyro: ~100x better
    # than that noise. The translation noise alpha3 is what lets AMCL fix an
    # along-track error of the odometry (wheel slip, delay), so it stays.
    # Offline replays (job-154 laps, the same scans, odometry with the wheel-
    # delay compensation, thin-wall map): AMCL along-track at 6 m/s mean / p95
    # -3.7 / 12.5 -> -1.1 / 7.7 cm, heading p95 1.5 -> 0.6 deg; EKF position
    # p95 9.7 -> 4.9 cm, still 100 % inside 2 sigma.
    # REAL CAR: re-check with the replay bench on a real recording -- wheel slip
    # and servo play make real odometry worse than the simulator's (if AMCL
    # lags at hard acceleration/braking: raise alpha3; if it is jumpy: lower it).
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.005
    alpha2: 0.0005
    alpha3: 0.02
    alpha4: 0.005
    alpha5: 0.0

    # --- Sensor model: how a scan is scored against the wall map ---
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0         # RPLIDAR A1
    max_beams: 60                 # use 60 of the 360 beams (speed)
    z_hit: 0.8                    # beam hit a wall where the map says
    z_rand: 0.2                   # random reading
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.1                # m, how far off a "good" hit may be
    laser_likelihood_max_dist: 2.0
    do_beamskip: false

    # --- Start pose (overridden by the launch file) ---
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
