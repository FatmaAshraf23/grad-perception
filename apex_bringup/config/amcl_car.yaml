# AMCL settings for the REAL car (apex_bringup car.launch.py, 2026-10-30).
# STARTING POINT = the simulator's tuned values (state_estimation/config/amcl_sim.yaml, see its comments for every
# WHY). A separate file on purpose: retuning the car must not change the simulator, and the other way round.
# car.launch.py overrides: initial_pose (start pose - half a map cell), map_topic /map_amcl (thin-wall copy),
# scan_topic /scan_a1 (de-skewed RPLIDAR), base_frame_id est/base_link.
# TO RE-CHECK ON REAL RECORDINGS (replay bench):
#   - sigma_hit: the real A1M8 had 2-9 mm noise standing still (job 188) but the SLAM map vs the real walls differ by
#     cm -> 0.1 m stays until a real replay says otherwise
#   - max_beams 60 of ~1080 real beams (simulator 360): same spacing of used beams, ~3x more beams to choose from
#   - alpha3 (along-track odometry noise): raise if AMCL lags at hard acceleration / braking, lower if it is jumpy
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "est/base_link"
    scan_topic: "/scan_a1"
    map_topic: "/map_amcl"
    tf_broadcast: true
    transform_tolerance: 0.3
    min_particles: 500
    max_particles: 1000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.05
    update_min_a: 0.05
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.005
    alpha2: 0.0005
    alpha3: 0.02
    alpha4: 0.005
    alpha5: 0.0
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 60
    z_hit: 0.8
    z_rand: 0.2
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
